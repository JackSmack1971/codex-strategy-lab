name: Codex Cloud readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STRATEGY_LAB_PREFETCH: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and smoke-check fresh environment
        run: bash .codex/setup.sh
      - name: Run engine and setup tests without network
        run: scripts/lab test
      - name: Verify warm offline maintenance
        run: bash .codex/maintenance.sh --offline
      - name: Verify start-time HTTPS routes
        run: bash .codex/start.sh
      - name: Confirm setup preserved tracked source and research artifacts
        run: git diff --exit-code
